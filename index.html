<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MathAscend Engine</title>

<link rel="manifest" href="manifest.json">

<script src="https://cdn.tailwindcss.com"></script>

<style>

@media print {

    body *{
        visibility:hidden;
    }

    #printable-area,
    #printable-area *{
        visibility:visible;
    }

    #printable-area{
        position:absolute;
        left:0;
        top:0;
        width:100%;
        padding:20px;
    }
}

.active-week{
    background:#4f46e5;
    color:white;
}

</style>
</head>

<body class="bg-slate-50 min-h-screen">

<header class="bg-indigo-700 text-white shadow-lg">

<div class="max-w-7xl mx-auto px-4 py-5 flex justify-between">

<div>
<h1 class="text-3xl font-bold">
MathAscend Engine
</h1>

<p class="text-indigo-200">
Accelerated 9‑Week Curriculum (Grades 4–8)
</p>
</div>

<div class="hidden md:block bg-indigo-800 px-4 py-2 rounded-lg">
Math • Fractions • Decimals • Algebra
</div>

</div>

</header>

<main class="max-w-7xl mx-auto p-4 md:p-8 flex flex-col md:flex-row gap-6">

<aside class="w-full md:w-72">

<h2 class="font-bold text-slate-500 uppercase text-sm mb-4">
Curriculum Timeline
</h2>

<nav id="week-menu" class="space-y-2"></nav>

<div class="mt-6 bg-white rounded-lg p-4 border">
<h3 class="font-bold mb-2">Student Progress</h3>

<div id="progress-text">
0 / 9 Weeks Completed
</div>

<div class="w-full bg-slate-200 rounded-full h-3 mt-3">
<div
id="progress-bar"
class="bg-indigo-600 h-3 rounded-full"
style="width:0%;">
</div>
</div>
</div>

</aside>

<section class="flex-1 bg-white rounded-xl shadow">

<div class="bg-gradient-to-r from-indigo-600 to-blue-600 text-white p-6">

<div
id="view-grade"
class="inline-block text-xs bg-white/20 px-3 py-1 rounded-full uppercase">
Grade 4
</div>

<h2
id="view-title"
class="text-3xl font-bold mt-3">
Loading...
</h2>

<p
id="view-description"
class="mt-2 text-indigo-100">
Loading curriculum...
</p>

</div>

<div class="p-6">

<div class="flex justify-between items-center mb-6">

<h3 class="text-xl font-bold">
Daily Objectives
</h3>

<button
onclick="markComplete()"
class="bg-green-600 text-white px-4 py-2 rounded-lg">
Mark Complete
</button>

</div>

<div
id="objectives-container"
class="space-y-4">
</div>

<div class="mt-8 bg-slate-50 border rounded-xl p-5 flex flex-col sm:flex-row gap-4 justify-between">

<div>
<h4 class="font-bold">
Worksheet Generator
</h4>

<p class="text-sm text-slate-600">
Print student practice sheets.
</p>
</div>

<button
onclick="printPracticeSheet()"
class="bg-indigo-600 text-white px-5 py-3 rounded-lg">
🖨 Print Worksheet
</button>

</div>

</div>
</section>

</main>

<div
id="printable-area"
class="hidden">
</div>

<script>

/* ======================================
   Curriculum
====================================== */

const curriculumData = [

{
week:1,
grade:"Grade 4",
title:"Week 1: Multi‑Digit Operations",
desc:"Addition, subtraction, multiplication and division foundations.",
objectives:[
{
day:"Day 1",
core:"Multi-digit addition",
math:"4829 + 3194"
},
{
day:"Day 2",
core:"Multi-digit subtraction",
math:"7402 - 2853"
},
{
day:"Day 3",
core:"Multiplication",
math:"3125 × 7"
},
{
day:"Day 4",
core:"Division",
math:"4832 ÷ 6"
},
{
day:"Day 5",
core:"Equivalent fractions",
math:"2/3 = 6/9"
}
],
problems:[
"4829 + 3194",
"7402 - 2853",
"3125 × 7",
"4832 ÷ 6"
]
},

{
week:2,
grade:"Grade 4/5",
title:"Week 2: Fraction Operations",
desc:"Addition, subtraction and decomposition of fractions.",
objectives:[
{
day:"Day 1",
core:"Add fractions",
math:"3/8 + 2/8"
},
{
day:"Day 2",
core:"Decompose fractions",
math:"7/10 = 5/10 + 2/10"
},
{
day:"Day 3",
core:"Mixed numbers",
math:"2¼ + 1½"
},
{
day:"Day 4",
core:"Tenths to hundredths",
math:"3/10 = 30/100"
},
{
day:"Day 5",
core:"Decimals",
math:"62/100 = .62"
}
],
problems:[
"5/12 + 4/12",
"3 4/5 - 1 2/5",
"7/10 to hundredths"
]
},

{
week:3,
grade:"Grade 5",
title:"Week 3: Advanced Fractions",
desc:"Unlike denominators and multiplication.",
objectives:[
{day:"Day 1",core:"Add unlike fractions",math:"1/3 + 1/4"},
{day:"Day 2",core:"Subtract fractions",math:"4/5 - 2/3"},
{day:"Day 3",core:"Estimation",math:"7/8 + 1/10"},
{day:"Day 4",core:"Fraction as division",math:"3/4 = 3 ÷ 4"},
{day:"Day 5",core:"Multiply fractions",math:"2/3 × 4/5"}
],
problems:[
"2/5 + 1/3",
"7/8 - 1/4",
"12 × 3/4"
]
},

{
week:4,
grade:"Grade 5/6",
title:"Week 4: Decimals & Fraction Division",
desc:"Multi-digit decimal operations.",
objectives:[
{day:"Day 1",core:"Add decimals",math:"4.25 + 1.7"},
{day:"Day 2",core:"Multiply decimals",math:"0.3 × 0.2"},
{day:"Day 3",core:"Divide decimals",math:"1.5 ÷ .5"},
{day:"Day 4",core:"Unit fractions",math:"1/3 ÷ 4"},
{day:"Day 5",core:"Reciprocal division",math:"6 ÷ 1/2"}
],
problems:[
"14.85 + 6.19",
"4.82 ÷ .2",
"8 ÷ 1/4"
]
},

{
week:5,
grade:"Grade 6",
title:"Week 5: Ratios & Integers",
desc:"Ratios, rates and positive/negative numbers.",
objectives:[
{day:"Day 1",core:"Ratios",math:"2:3"},
{day:"Day 2",core:"Unit rates",math:"15 miles / 3 hrs"},
{day:"Day 3",core:"Equivalent ratios",math:"2:5 = 8:20"},
{day:"Day 4",core:"Integers",math:"-8 + 12"},
{day:"Day 5",core:"Order of operations",math:"4 + 3(5-2)"}
],
problems:[
"8:12",
"15% of 200",
"-15 + 28"
]
},

{
week:6,
grade:"Grade 6/7",
title:"Week 6: Proportions & Percent",
desc:"Applying percent and proportional reasoning.",
objectives:[
{day:"Day 1",core:"Percents",math:"25%"},
{day:"Day 2",core:"Convert decimals",math:"0.35 = 35%"},
{day:"Day 3",core:"Sales tax",math:"8%"},
{day:"Day 4",core:"Discounts",math:"20% Off"},
{day:"Day 5",core:"Percent increase",math:"+15%"}
],
problems:[
"25% of 80",
"35% of 200"
]
},

{
week:7,
grade:"Grade 7",
title:"Week 7: Algebra Foundations",
desc:"Expressions, properties and equations.",
objectives:[
{day:"Day 1",core:"Variables",math:"x + 5"},
{day:"Day 2",core:"Expressions",math:"3x + 4"},
{day:"Day 3",core:"Simplify",math:"2x + 3x"},
{day:"Day 4",core:"Properties",math:"Distributive"},
{day:"Day 5",core:"Solve equations",math:"x + 5 = 12"}
],
problems:[
"2x+3x",
"4a+7=15"
]
},

{
week:8,
grade:"Grade 7/8",
title:"Week 8: Geometry",
desc:"Area, volume and measurement.",
objectives:[
{day:"Day 1",core:"Area",math:"A=l×w"},
{day:"Day 2",core:"Triangles",math:"½bh"},
{day:"Day 3",core:"Circles",math:"πr²"},
{day:"Day 4",core:"Volume",math:"lwh"},
{day:"Day 5",core:"Scale drawings",math:"1:10"}
],
problems:[
"Rectangle area",
"Cylinder volume"
]
},

{
week:9,
grade:"Grade 8",
title:"Week 9: Integrated Review",
desc:"Comprehensive readiness and assessment.",
objectives:[
{day:"Day 1",core:"Fractions Review",math:"Mixed Practice"},
{day:"Day 2",core:"Decimals Review",math:"Mixed Practice"},
{day:"Day 3",core:"Ratios Review",math:"Mixed Practice"},
{day:"Day 4",core:"Algebra Review",math:"Mixed Practice"},
{day:"Day 5",core:"Final Benchmark",math:"Assessment"}
],
problems:[
"Comprehensive Review"
]
}

];

let currentWeek = 0;
let completedWeeks =
JSON.parse(localStorage.getItem("completedWeeks") || "[]");

/* ======================================
   Functions
====================================== */

function renderWeekMenu(){

const menu =
document.getElementById("week-menu");

menu.innerHTML = curriculumData
.map((week,index)=>`
<button
onclick="loadWeek(${index})"
id="week-btn-${index}"
class="w-full text-left px-4 py-3 rounded-lg bg-white border hover:bg-indigo-50">
Week ${week.week}
</button>
`)
.join("");

}

function loadWeek(index){

currentWeek=index;

const week=
curriculumData[index];

document.getElementById("view-grade").textContent=
week.grade;

document.getElementById("view-title").textContent=
week.title;

document.getElementById("view-description").textContent=
week.desc;

document.getElementById(
"objectives-container"
).innerHTML=
week.objectives
.map(obj=>`
<div class="border rounded-lg p-4 bg-slate-50">
<h4 class="font-bold">
${obj.day}
</h4>

<p class="mt-2">
${obj.core}
</p>

<div class="mt-2 text-indigo-600 font-mono">
${obj.math}
</div>
</div>
`).join("");

document.querySelectorAll(
"[id^='week-btn']"
).forEach(btn=>{
btn.classList.remove("active-week");
});

document.getElementById(
`week-btn-${index}`
).classList.add("active-week");

}

function markComplete(){

if(!completedWeeks.includes(currentWeek)){

completedWeeks.push(currentWeek);

localStorage.setItem(
"completedWeeks",
JSON.stringify(completedWeeks)
);

updateProgress();

alert("Week completed!");
}
}

function updateProgress(){

const count=
completedWeeks.length;

document.getElementById(
"progress-text"
).innerText=
`${count} / 9 Weeks Completed`;

document.getElementById(
"progress-bar"
).style.width=
`${(count/9)*100}%`;

}

function printPracticeSheet(){

const week=
curriculumData[currentWeek];

const area=
document.getElementById(
"printable-area"
);

area.innerHTML=`

<h1 style="font-size:28px;">
${week.title}
</h1>

<h2>
Practice Problems
</h2>

<ol>
${week.problems.map(
p=>`
<li style="margin-bottom:40px;">
${p}
<hr>
</li>
`
).join("")}
</ol>

`;

window.print();
}

/* ======================================
   Startup
====================================== */

renderWeekMenu();
loadWeek(0);
updateProgress();

if("serviceWorker" in navigator){
navigator.serviceWorker.register("./sw.js");
}

</script>

</body>
</html>
